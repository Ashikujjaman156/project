{% extends "base.html" %}{% block title %}Log in{% endblock %}
{% block shell %}
<div class="split">
<aside class="side">{% include "_scene.html" %}<div class="side-copy"><h2>Welcome back.</h2><p>See where every application stands.</p></div></aside>
<section class="pane"><div class="narrow">
<h1>Log in</h1>
<form method="post" class="form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label>Email <input type="email" name="email" value="{{ request.form.email }}" required autofocus></label>
  <label>Password <input type="password" name="password" required></label>
  <button class="btn" type="submit">Log in</button>
</form>
<p class="muted">New student? <a href="{{ url_for('main.register') }}">Create an account</a>.</p>
</div></section>
</div>
{% endblock %}
